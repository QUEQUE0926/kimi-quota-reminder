name: signal

on:
  repository_dispatch:
    types: [quota-sync, quota-exhausted]

permissions:
  contents: write

concurrency:
  group: quota-signal
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply signal to state
        env:
          EVENT_ACTION: ${{ github.event.action }}
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: node scripts/signal.mjs

      - name: Commit state
        run: |
          git config user.name "quota-reminder-bot"
          git config user.email "quota-reminder-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "signal: ${{ github.event.action }}"
          ok=
          for i in 1 2 3; do
            git pull --rebase -X ours origin main || true
            if git push; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ]
