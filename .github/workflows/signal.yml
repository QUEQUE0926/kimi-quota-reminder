name: signal

on:
  repository_dispatch:
    types: [quota-sync, quota-exhausted, quota-close]
  # 手动测试入口：Run workflow 时可选分支（测试请选 dev/multi-platform，勿污染 main 状态）
  workflow_dispatch:
    inputs:
      event_type:
        description: 信号类型
        required: true
        type: choice
        options: [quota-sync, quota-exhausted, quota-close]
      payload:
        description: 'client_payload（JSON，如 {"tier":"5h"}）'
        required: false
        type: string
        default: '{}'

permissions:
  contents: write

concurrency:
  group: quota-signal
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply signal to state
        env:
          EVENT_ACTION: ${{ github.event.action || inputs.event_type }}
          CLIENT_PAYLOAD: ${{ inputs.payload || toJson(github.event.client_payload) }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER: ${{ vars.BARK_SERVER }}
        run: node scripts/signal.mjs

      - name: Commit state
        run: |
          git config user.name "quota-reminder-bot"
          git config user.email "quota-reminder-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "signal: ${{ github.event.action }}"
          cur=$(git symbolic-ref --short HEAD 2>/dev/null || echo main)
          ok=
          for i in 1 2 3; do
            git pull --rebase -X ours origin "$cur" || true
            if git push; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ]
