name: signal

on:
  repository_dispatch:
    types: [quota-sync, quota-exhausted, quota-close]
  # 手动测试入口：Run workflow 时可选分支（测试请选 dev/multi-platform，勿污染 main 状态）
  workflow_dispatch:
    inputs:
      event_type:
        description: 信号类型
        required: true
        type: choice
        options: [quota-sync, quota-exhausted, quota-close]
      payload:
        description: 'client_payload（JSON，如 {"tier":"5h"}）'
        required: false
        type: string
        default: '{}'

permissions:
  contents: write

concurrency:
  group: quota-signal
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      # 防呆护栏（方案 §6.1）：本 workflow 只接受 repository_dispatch（本机 hook 真实信号）
      # 和 dev 分支的手动测试。忘选分支时显式失败，避免悄悄污染 main 的线上 state.json。
      # 校准 main 线上状态请用 manual workflow，它不受此限。
      - name: 守卫：main 分支禁止手动触发
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          echo "::error::禁止在 main 分支手动触发 signal（测试请切到 dev/multi-platform 分支，校准线上状态请用 manual workflow）"
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply signal to state
        env:
          EVENT_ACTION: ${{ github.event.action || inputs.event_type }}
          CLIENT_PAYLOAD: ${{ inputs.payload || toJson(github.event.client_payload) }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER: ${{ vars.BARK_SERVER }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          # 测试消息打标（方案 §6.1）：非 main 分支 → 推送标题带 [测试] 前缀、Bark 进测试分组
          # 两个分支都返回非空字符串（'0'/'1'），不依赖空字符串的真假判断
          PUSH_TEST: ${{ github.ref_name == 'main' && '0' || '1' }}
        run: node scripts/signal.mjs

      - name: Commit state
        run: |
          git config user.name "quota-reminder-bot"
          git config user.email "quota-reminder-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "signal: ${{ github.event.action }}"
          cur=$(git symbolic-ref --short HEAD 2>/dev/null || echo main)
          ok=
          for i in 1 2 3; do
            git pull --rebase -X ours origin "$cur" || true
            if git push; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ]
