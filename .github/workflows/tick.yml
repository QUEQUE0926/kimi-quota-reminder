name: tick

on:
  schedule:
    # GitHub 高频 cron 是尽力而为调度，实测延迟可达 2~4 小时（方案 §6.2）——
    # 保留它作为兜底；准点靠下面的 repository_dispatch 由外部 cron 叫醒。
    - cron: "*/5 * * * *"
  repository_dispatch:
    # 外部 cron 服务（如 cron-job.org）每 5 分钟 POST /dispatches {event_type: tick-wake}
    types: [tick-wake]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # 与 signal/manual 共用 group（按分支隔离）：三者都改写 state.json，
  # 独立 group + rebase -X ours 会让后完成一方的状态更新被静默丢弃。
  # cancel-in-progress: false —— 排队等上一个写完，绝不取消在跑的 tick。
  group: quota-state-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      # 防呆护栏（方案 §6.1）：本 workflow 的日常入口是 cron 定时；手动运行只允许在 dev
      # 分支做测试。忘选分支时显式失败，避免测试改动 main 的线上 state.json / 时刻表。
      - name: 守卫：main 分支禁止手动触发
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          echo "::error::禁止在 main 分支手动触发 tick（测试请切到 dev/multi-platform 分支，校准线上状态请用 manual workflow）"
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check timetable boundaries and push
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER: ${{ vars.BARK_SERVER }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          WXPUSHER_APPTOKEN: ${{ secrets.WXPUSHER_APPTOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          # 测试消息打标（方案 §6.1）：非 main 分支 → 推送标题带 [测试] 前缀、Bark 进测试分组
          # 两个分支都返回非空字符串（'0'/'1'），不依赖空字符串的真假判断
          PUSH_TEST: ${{ github.ref_name == 'main' && '0' || '1' }}
        run: node scripts/tick.mjs

      - name: Commit state
        run: |
          git config user.name "quota-reminder-bot"
          git config user.email "quota-reminder-bot@users.noreply.github.com"
          git add state.json heartbeat.txt
          git diff --cached --quiet || git commit -m "tick $(date -u +%Y-%m-%dT%H:%MZ)"
          cur=$(git symbolic-ref --short HEAD 2>/dev/null || echo main)
          ok=
          for i in 1 2 3; do
            git pull --rebase -X ours origin "$cur" || true
            if git push; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ]
