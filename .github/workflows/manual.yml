name: manual

on:
  workflow_dispatch:
    inputs:
      action:
        description: 操作类型
        required: true
        type: choice
        options:
          - test_push
          - set_anchor
          - set_weekly_next
          - set_monthly_anchor
          - monthly_cap
          - clear_flags
      value:
        description: 时间值（set_*/monthly_cap 必填，ISO 8601 如 2026-09-06T01:30:00+08:00）
        required: false
        type: string

permissions:
  contents: write

jobs:
  manual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run manual action
        env:
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_VALUE: ${{ inputs.value }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER: ${{ vars.BARK_SERVER }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          # 测试消息打标（方案 §6.1）：非 main 分支 → 推送标题带 [测试] 前缀、Bark 进测试分组
          # manual 不加防呆守卫（它本来就用于校准 main 线上状态），但在 dev 上跑同样会打标
          # 两个分支都返回非空字符串（'0'/'1'），不依赖空字符串的真假判断
          PUSH_TEST: ${{ github.ref_name == 'main' && '0' || '1' }}
        run: node scripts/manual.mjs

      - name: Commit state
        run: |
          git config user.name "quota-reminder-bot"
          git config user.email "quota-reminder-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "manual: ${{ inputs.action }}"
          cur=$(git symbolic-ref --short HEAD 2>/dev/null || echo main)
          ok=
          for i in 1 2 3; do
            git pull --rebase -X ours origin "$cur" || true
            if git push; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ]
